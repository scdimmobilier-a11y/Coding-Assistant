name: Extraire les archives zip en dossiers

# Se lance à la main : onglet "Actions" > "Extraire les archives zip en dossiers" > "Run workflow"
on:
  workflow_dispatch:
    inputs:
      remove_zips:
        description: "Supprimer les fichiers .zip du dépôt après extraction ?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire chaque zip dans un dossier du même nom
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Aucun fichier .zip à la racine : rien à faire."
            exit 0
          fi
          for z in "${zips[@]}"; do
            d="${z%.zip}"
            echo "→ $z  ->  $d/"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
          done
          chmod +x scripts/*.sh 2>/dev/null || true

      - name: Supprimer les zips (optionnel)
        if: ${{ inputs.remove_zips }}
        run: git rm -q --ignore-unmatch -- *.zip

      - name: Enregistrer et envoyer les changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Remplacer les archives zip par les dossiers extraits"
            git push
          fi
