name: Déplacer les sous-dossiers de DONNIYA à la racine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-subfolders:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déplacer les sous-dossiers à la racine et supprimer DONNIYA
        run: |
          if [ ! -d "DONNIYA" ]; then
            echo "Le dossier DONNIYA est introuvable à la racine."
            exit 0
          fi

          # Déplacer uniquement les sous-dossiers de DONNIYA vers la racine
          find DONNIYA -mindepth 1 -maxdepth 1 -type d -exec mv -f {} . \;

          # Supprimer le dossier DONNIYA (et tout éventuel fichier résiduel inutile)
          rm -rf DONNIYA

      - name: Enregistrer et pousser les changements sur GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: déplacement des sous-dossiers de DONNIYA à la racine"
            git push
          else
            echo "Aucun changement détecté."
          fi
